
name: Build and deploy ZonaGol Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install and verify backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Prepare production package
        shell: bash
        run: |
          mkdir -p deploy
          cp -R backend/src deploy/src
          cp backend/package.json backend/package-lock.json deploy/
          cd deploy
          npm ci --omit=dev

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: zonagol-backend
          path: deploy/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: zonagol-backend
          path: ./deploy

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: zonagol-backend
          slot-name: Production
          package: ./deploy

